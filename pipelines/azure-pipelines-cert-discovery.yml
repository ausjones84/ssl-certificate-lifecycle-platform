# azure-pipelines-cert-discovery.yml
# Scheduled Certificate Discovery Pipeline - runs weekly

trigger: none

schedules:
  - cron: '0 8 * * 1'
    displayName: Weekly Certificate Discovery
    branches:
      include: [ main ]
    always: true

variables:
  - group: cert-lifecycle-production-vars
  - name: pythonVersion
    value: '3.11'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Discovery
    displayName: Certificate Discovery and Risk Analysis
    jobs:
      - job: DiscoverAndAnalyze
        displayName: Discover Certificates
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: pip install -r requirements.txt
            displayName: Install Dependencies

          - task: AzureCLI@2
            displayName: Run Certificate Discovery
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                python platform/main.py discover --subscription "$(subscriptionName)"

          - task: AzureCLI@2
            displayName: Run AI Risk Analysis
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                python platform/main.py ai-report --days 90

          - task: PublishPipelineArtifact@1
            displayName: Publish Reports
            inputs:
              targetPath: reports/
              artifactName: certificate-reports-$(Build.BuildId)
